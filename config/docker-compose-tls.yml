# MongoDB 8.0 con TLS - vedi docs/01-tls-guida-completa.md, Parte 6
# Sulla VM va salvato come ~/mongodb/docker-compose.yml
# Richiede ~/mongodb/tls/server.pem (owner 999, 600) e ~/mongodb/tls/ca.pem
services:
  mongo:
    image: mongo:8.0
    container_name: mongo
    restart: unless-stopped
    command:
      - --tlsMode=requireTLS
      - --tlsCertificateKeyFile=/etc/mongo/tls/server.pem
      - --tlsCAFile=/etc/mongo/tls/ca.pem
      - --tlsAllowConnectionsWithoutCertificates
      - --tlsDisabledProtocols=TLS1_0,TLS1_1
    ports:
      - "127.0.0.1:27017:27017"
      # - "<IP_PRIVATO_VM>:27017:27017"   # accesso diretto (Parte 6.1)
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    volumes:
      - mongo-data:/data/db
      - ./tls/server.pem:/etc/mongo/tls/server.pem:ro
      - ./tls/ca.pem:/etc/mongo/tls/ca.pem:ro
    secrets:
      - mongo_root_password

volumes:
  mongo-data:

secrets:
  mongo_root_password:
    file: ./mongo_root_password.txt
